  'juventus next gen','stella rossa','casertana'

const PRESS_MALE_EXCEPTIONS=new Set(['latina','sudtirol','hellas verona','psv eindhoven']);
const PRESS_LO_CLUBS=new Set(['spezia','sporting cp','sturm graz','stoccarda','slovan bratislava','shakhtar donetsk','sparta praga']);
const PRESS_CLUB_ALIASES={'delfino pescara':'Pescara','delfino pescara 1936':'Pescara',

function pressNormalizeClub(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();}
function pressClubName(idOrName){
 const club=(typeof teamById==='function' && teamById(idOrName))||null;
 const text=club?.name||String(idOrName||'').trim();
 return text;
}
function pressClubFeminine(idOrName){
 const name=pressClubName(idOrName),n=pressNormalizeClub(name);
 if(PRESS_FEMININE_CLUBS.has(n))return true;
 if(/^(vis|virtus|pro)\s/.test(n))return true;
 if(PRESS_MALE_EXCEPTIONS.has(n))return false;
 if(/(?:ese|ina|iana)$/.test(n) && !['lumezzane'].includes(n))return true;
 return false;
}
function pressArticle(idOrName){
 let n=pressNormalizeClub(pressClubName(idOrName));
 if(/^[aeiouh]/.test(n))return "l'";
 if(pressClubFeminine(idOrName))return 'la';
 if(['sudtirol','südtirol','psv eindhoven'].includes(n))return 'il';
 if(PRESS_LO_CLUBS.has(n) || /^(?:s[^aeiouhùü]|z|gn|x|y)/.test(n))return 'lo';
 return 'il';
}
function pressClub(idOrName,cap=false){
 let name=pressClubName(idOrName);
 let a=pressArticle(idOrName),out=a==="l'"?a+name:a+' '+name;
 return cap?out[0].toUpperCase()+out.slice(1):out;
}
function pressClubPrep(prep,idOrName,cap=false){
 let a=pressArticle(idOrName),name=pressClubName(idOrName);
 let forms={di:{il:'del',lo:'dello',la:'della',"l'":"dell'"},
 a:{il:'al',lo:'allo',la:'alla',"l'":"all'"},
 da:{il:'dal',lo:'dallo',la:'dalla',"l'":"dall'"},
 in:{il:'nel',lo:'nello',la:'nella',"l'":"nell'"},
 su:{il:'sul',lo:'sullo',la:'sulla',"l'":"sull'"}};
 let first=forms[prep]?.[a] || (prep+' '+a);
 let out=first.endsWith("'")?first+name:first+' '+name;
 return cap?out[0].toUpperCase()+out.slice(1):out;
}
// Per vecchie edizioni: corregge la visualizzazione, non modifica il giornale già archiviato.
function pressPolishArchived(text){
 let out=String(text||'');
 const clubs=(typeof ALLCLUBS!=='undefined'?ALLCLUBS:[]).map(x=>x.name);
 clubs.push('Delfino Pescara 1936','Delfino Pescara','Virtus Lanciano','Vibonese');
 const sorted=[...new Set(clubs)].sort((a,b)=>b.length-a.length);
 const escRegex=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const rxBeforeArticle=/(?:^|[\s(])(?:il|lo|la|gli|le|del|dello|della|al|allo|alla|dal|dallo|dalla|nel|nello|nella|sul|sullo|sulla|col|coi)\s*$/i;
 const rxBeforeApostrophe=/(?:dell|all|dall|nell|sull|l)['’]$/i;
 for(const name of sorted){
  const rx=new RegExp('(^|[^\\p{L}\\p{N}])((?:di|a|da|in|su|per|con|contro)\\s+)?('+escRegex(name)+')(?=$|[^\\p{L}\\p{N}])','giu');
  out=out.replace(rx,(whole,space,prep,club,offset,source)=>{
   const left=source.slice(Math.max(0,offset-60),offset+space.length);
   if(rxBeforeArticle.test(left)||rxBeforeApostrophe.test(left))return whole;
   let polished=prep?pressClubPrep(prep.trim().toLowerCase(),club):pressClub(club);
   const disaster=/(?:DISASTRO|TRIONFO)\s*$/i.test(left);
   if(disaster&&!prep)polished=pressClubPrep('di',club);
   const atStart=offset+space.length===0 || /[.!?]\s*$/.test(left);
   if(atStart || (/^[A-ZÀ-Ú]/.test(club)&&/\n\s*$/.test(left)))polished=polished[0].toUpperCase()+polished.slice(1);
   // Titoli in maiuscolo mantengono la capitalizzazione.
   if(club===club.toUpperCase() && club.length>2)polished=polished.toLocaleUpperCase('it-IT');
   return space+polished;
  });
 }
 return out;
}

/* REGINA CALCIO 0.2 — modulo autonomo, non scrive mai nel salvataggio della città */
/* Aggiornamento on-demand degli organici: Wikipedia 2026-27, senza nomi inventati. */
const wikiLoading = new Map();
function wikiRosterRows(markup){
 const doc=new DOMParser().parseFromString(markup,'text/html'),found=[];
 const seen=new Set();
 for(const table of doc.querySelectorAll('table')){
  const rows=[...table.querySelectorAll('tr')];
  const caption=(rows.slice(0,3).map(x=>x.textContent).join(' ')||'').toLowerCase();
  if(!caption.includes('calciatore')&&!caption.includes('calciatori'))continue;
  for(const tr of rows){
   let tds=[...tr.children].filter(x=>/^(TD|TH)$/.test(x.tagName));
   if(tds.length<3)continue;
   let col=tds.findIndex(x=>/^[P D C A]$/.test(x.textContent.replace(/\s/g,'')));
   if(col<0)continue;
   let role=tds[col].textContent.trim().toUpperCase();
   if(!'PDCA'.includes(role)||role.length!==1)continue;
   let name=(tds[col+1]?.textContent||'').replace(/\[[^\]]*\]/g,'').replace(/\([^)]*(?:capitano|vicecapitano|prestito|aggregato|giovanile)[^)]*\)/gi,'').replace(/\s+/g,' ').trim();
   if(!name||name.length<4||name.length>70||/^(Calciatore|Nome|Staff|Nessuno)/i.test(name))continue;
   let key=name.toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
   if(seen.has(key))continue;seen.add(key);found.push({name,pos:role});
  }
 }
 return found;
}
async function hydrateWikiRoster(id,notifyUser=false){
 if(!st||!teamById(id))return false;
 if(st.wikiUpdates?.[id]&&!notifyUser)return true;
 if(wikiLoading.has(id))return wikiLoading.get(id);
 let t=teamById(id),title=wikiTitle(t);
 const job=(async()=>{
  try{
   const tried=[title+' 2026-2027',title];
   let real=[];
   for(const page of tried){
    const url='https://it.wikipedia.org/w/api.php?action=parse&format=json&origin=*&prop=text&page='+encodeURIComponent(page);
    const ac=new AbortController(),timeout=setTimeout(()=>ac.abort(),11500);
    try{
     let res=await fetch(url,{signal:ac.signal});if(!res.ok)continue;
     let json=await res.json();if(json.error||!json.parse?.text?.['*'])continue;
     real=wikiRosterRows(json.parse.text['*']);if(real.length>=16)break;
    }catch(e){}finally{clearTimeout(timeout)}
   }
   if(real.length<16)throw new Error('Nessuna rosa completa disponibile nelle pagine consultate.');
   // Selezione di una rosa da 25 mantenendo le quote per ruolo.
   let chosen=[],used=new Set(),limits={P:3,D:9,C:8,A:5};
   for(let role of ['P','D','C','A'])for(let person of real.filter(x=>x.pos===role).slice(0,limits[role])){
    const key=person.name.toLowerCase();if(!used.has(key)){chosen.push(person);used.add(key)}
   }
   for(let person of real){if(chosen.length>=25)break;let key=person.name.toLowerCase();if(!used.has(key)){chosen.push(person);used.add(key)}}
   const target=st.squad[id];
   if(!target?.length)return false;
   let old={};
   for(let p of target)if(p.verified)old[p.name.toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'')]=p.tech;
   chosen.slice(0,25).forEach((person,i)=>{
    if(!target[i])return;
    target[i].name=person.name;target[i].pos=person.pos;
    const previous=old[person.name.toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'')];
    if(Number.isFinite(previous))target[i].tech=previous;
    target[i].verified=true;
    target[i].rosterSource='Wikipedia, annata 2026/27';
   });
   st.wikiUpdates??={};st.wikiUpdates[id]=true;
   if(id===st.club && st.game===0)st.lineup=autoLineupFor(st,id);
   persist();
   if(notifyUser)alert(`Rosa di ${t.name} aggiornata: ${Math.min(25,chosen.length)} nominativi trovati su Wikipedia. I valori tecnici restano stime di gioco.`);
   if(['squad','market','today'].includes(view))render();
   return true;
  }catch(e){if(notifyUser)alert('Non sono riuscito ad aggiornare questa rosa da Wikipedia: '+e.message);return false}
  finally{wikiLoading.delete(id)}
 })();wikiLoading.set(id,job);return job;
}

function leagueView(){let stats=sortedStandings(),scorers=scorersForLeague();let post=st.postseason;return `<section class="card"><div class="row spread"><h2>Classifica · ${GROUPN[st.league]}</h2><span class="pill">${st.game}/38 giornate</span></div><div class="tablewrap"><table class="table"><tr><th>#</th><th>Squadra</th><th>Pt</th><th>G</th><th>GF</th><th>GS</th><th>DR</th><th>Fase finale</th></tr>${stats.map((x,i)=>`<tr class="${x.id===st.club?'me':''}"><td>${i+1}</td><td>${crest(x.id,true)} ${ESC(x.name)}</td><td><b>${x.pts}</b></td><td>${x.p}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gf-x.ga}</td><td class="tiny">${rankText(i,st.league)}</td></tr>`).join('')}</table></div><div class="notice">Serie A: tre retrocessioni. Serie B: prime due in A, terza promozione attraverso playoff 3ª–8ª (salvo vantaggio superiore a 14 punti); ultime tre retrocesse, playout tra 16ª e 17ª salvo distacco superiore a quattro punti. Serie C: vincitrici dei tre gironi in B e un'ulteriore promozione ai playoff nazionali; retrocedono 20ª e perdenti dei playout 16ª/19ª, 17ª/18ª, con distacco >8 punti.</div></section><section class="card"><h3>⚽ Classifica marcatori · ${GROUPN[st.league]}</h3>${scorers.length?`<div class="tablewrap"><table class="table">${scorers.map((p,i)=>`<tr><td>${i+1}</td><td>${ESC(p.name)}</td><td>${ESC(teamById(p.club).name)}</td><td><b>${p.n}</b></td></tr>`).join('')}</table></div>`:'<p class="muted">I marcatori appariranno dopo la prima partita.</p>'}</section>${post?`<section class="card"><h3>🏆 Playoff e playout</h3><p>${ESC(post.stage||'')} ${post.done?'· conclusi':'· in corso'}</p>${(post.history||[]).slice(-16).map(x=>`<p class="tiny">${ESC(x)}</p>`).join('')}</section>`:''}`}
function reportNavigation(){let results=st.results||[];if(!results.length)return '<p class="muted">Nessuna edizione ancora pubblicata.</p>';let cur=results[selectedReport]||results[0],curMonth=(st.archiveMonth||cur.day.slice(0,7)),[year,month]=curMonth.split('-').map(Number);let first=new Date(year,month-1,1).getDay(),offset=(first+6)%7,count=new Date(year,month,0).getDate();return `<div class="row spread"><button class="btn alt" onclick="moveArchive(-1)">‹</button><strong>${new Date(year,month-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</strong><button class="btn alt" onclick="moveArchive(1)">›</button></div><div class="calendar">${['L','M','M','G','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:count},(_,i)=>{let day=curMonth+'-'+String(i+1).padStart(2,'0'),index=results.findIndex(r=>r.day===day);return index>=0?`<button class="${cur.day===day?'active':''}" onclick="selectedReport=${index};render()">${i+1}📰</button>`:`<span>${i+1}</span>`}).join('')}</div>`}

function teamAverage(id){return st.squad[id].reduce((s,p)=>s+p.tech,0)/Math.max(1,st.squad[id].length)}
function createMarketOffers(){if(st.marketSeen?.includes(st.nextDay.slice(0,7)))return;let mine=MY_SQ().filter(x=>x.tech>3&&!x.out),others=ALLCLUBS.filter(x=>x.id!==st.club&&Math.random()>.45);st.offers=[];let attempts=Math.min(3,Math.floor(rand(1,4)));for(let i=0;i<attempts;i++){let buyer=others.splice(Math.floor(Math.random()*others.length),1)[0],p=mine.splice(Math.floor(Math.random()*mine.length),1)[0];if(!p||!buyer)continue;let offered=+CLAMP(p.tech*rand(.88,1.3),1,10).toFixed(1);if((st.budgets?.[buyer.id]??0)<offered)continue;st.offers.push({id:RID(),club:buyer.id,player:p.id,amount:offered,pending:true})}st.marketSeen=st.marketSeen||[];st.marketSeen.push(st.nextDay.slice(0,7))}

function marketView(){let open=marketCanOpen(),available=ALLCLUBS.filter(x=>x.id!==st.club),offers=st.offers||[];return `<section class="card"><div class="row spread"><h2>Calciomercato</h2><span class="pill">💰 ${st.budget.toFixed(1)} crediti</span></div><div class="notice">${open?'🟢 Finestra APERTA (fine mese)':'🔒 Finestra CHIUSA: riapre alla fine di ogni mese.'} Budget iniziale = media della grandezza della città e del valore tecnico medio della rosa (entrambi 0–10). Il prezzo di un calciatore è il suo valore tecnico arrotondato. Niente denaro reale.</div>${!open?'<p>Puoi già consultare la rosa in La mia squadra e preparare le scelte.</p>':`<h3>Offerte ricevute · massimo tre per finestra</h3>${offers.length?offers.map(o=>{let p=MY_SQ().find(x=>x.id===o.player);return `<div class="task"><div style="flex:1"><b>${ESC(p?.name||'Giocatore ceduto')}</b><div class="muted">${ESC(teamById(o.club)?.name||'Club')} offre <b>${o.amount.toFixed(1)} crediti</b></div><div class="muted tiny">${o.pending?'Puoi accettare o chiedere di più. Non esiste il pulsante rifiuta.':ESC(o.outcome||'Trattativa conclusa')}</div></div>${o.pending?`<button class="btn" onclick="settleOffer('${o.id}',false)">Accetta</button><button class="btn alt" onclick="settleOffer('${o.id}',true)">Chiedi di più</button>`:''}</div>`}).join(''):'<p class="muted">Nessuna offerta ricevuta in questa finestra.</p>'}<h3>Acquista da un club</h3><div class="two"><div><label class="label">Club venditore (qualsiasi serie)</label><select id="buyTeam" onchange="updateBuyPlayers()">${available.map(t=>`<option value="${t.id}">${GROUPN[t.league]} · ${ESC(t.name)}</option>`).join('')}</select></div><div><label class="label">Calciatore</label><select id="buyPick"></select></div></div><p><button class="btn" onclick="buyPlayer()">Acquista calciatore</button></p><h3>Giocatori fuori rosa</h3><p class="muted">Puoi escludere o reintegrare un calciatore solo durante una finestra di mercato. Un fuori rosa non può scendere in campo.</p>${M function updateBuyPlayers(){let id=document.getElementById('buyTeam')?.value,el=document.getElementById('buyPick');if(!id||!el||!st.squad[id])return;el.innerHTML=st.squad[id].filter(p=>!p.out).slice().sort((a,b)=>b.tech-a.tech).map(p=>`<option value="${p.id}">${ESC(p.name)} · ${p.pos} · ${p.tech.toFixed(1)} · ${Math.ceil(p.tech)} cr.</option>`).join('')}

// Tradizione e concorrenza locale: i quartieri e le seconde squadre NON acquisiscono
// automaticamente l'intero bacino urbano di Milano, Roma o Torino.
const SUPPORT_MULT_26={
 Inter:1.70,Milan:1.70,Juventus:1.70,Roma:1.55,Lazio:1.08,Napoli:1.60,
 'Atalanta':1.42,'Fiorentina':1.35,'Bologna':1.22,'Torino':1.10,
 'Genoa':1.11,'Sampdoria':1.11,'Palermo':1.44,'Bari':1.37,'Catania':1.42,

 'Juventus Next Gen':.38,'Atalanta U23':.38,'Inter U23':.38
};
const financialRound=(n)=>Math.round(n*100)/100;
const financialClamp=(n,min,max)=>Math.min(max,Math.max(min,n));
function catchmentRating(t){
  return financialClamp(Number(CITY_RATING_26[t.name]??citySize(t)??4),0,10);
}
function fanProfile(t){
  const city=catchmentRating(t),mult=SUPPORT_MULT_26[t.name]??1;
  // Bacino limitato dalla dimensione urbana e dalla tradizione, non un dato reale.
  const capacity=Math.max(600,Math.round((950+30000*Math.pow(city/10,2.0))*mult));
  const baseShare=t.league==='A'?.67:t.league==='B'?.60:.54;
  const fans=Math.min(capacity,Math.max(300,Math.round(capacity*baseShare)));
  // Massimo guadagno sportivo nell'arco di una stagione; le cessioni non sono soggette al tetto.
  const seasonalCap=financialRound(1.4+5.5*Math.pow(city/10,1.5));
  return {cityIndex:city, fanCap:capacity, fans, initialFans:fans,
    seasonalCap, earningsSeason:0, lastMatch:null, lastDay:null,
    latestDelta:0, latestIncome:0, wins:0, draws:0, losses:0};
}
function ensureFinances(s){
  if(!s)return;
  if(!s.finances||s.finances.version!==1){
    s.finances={version:1,created:typeof TODAY==='function'?TODAY():'',clubs:{},
      note:'Economia attiva da questa versione; nessun ricavo retroattivo.'};
  }
  for(const t of ALLCLUBS)if(!s.finances.clubs[t.id])s.finances.clubs[t.id]=fanProfile(t);
}
function applyFanResult(s, clubId,home,goalsFor,goalsAgainst,day){
  ensureFinances(s);
  const team=teamById(clubId),f=s.finances.clubs[clubId];
  if(!f||f.lastDay===day)return null; // una sola contabilizzazione per giorno
  const before=f.fans;
  const win=goalsFor>goalsAgainst,draw=goalsFor===goalsAgainst;
  const margin=Math.min(5,Math.abs(goalsFor-goalsAgainst));
  let delta;
  if(win)delta=Math.max(1,Math.round((f.fanCap-before)*(.047+.004*margin)));
  else if(draw)delta=Math.max(0,Math.round((f.fanCap-before)*.010));
  else delta=-Math.max(1,Math.round(before*(.009+.0018*margin)));
  f.fans=financialClamp(before+delta,Math.round(f.fanCap*.20),f.fanCap);
  delta=f.fans-before;
  if(win)f.wins++;else if(draw)f.draws++;else f.losses++;
  const city=f.cityIndex/10,fill=f.fans/f.fanCap;
  const leagueScale=team.league==='A'?1.12:team.league==='B'?.85:.64;
  // Ricavo gara / tv / premio sportivo. Le piccole città guadagnano molto meno
  // e non possono generare crediti illimitati in una sola stagione.
  const ticketBase=(home?.030:.005)+(.120*Math.pow(city,1.45)*fill*(home?1:.36));
  const sportBonus=win?.060+(.054*city):draw?.016:0;
  const gross=(ticketBase+sportBonus)*leagueScale;
  const room=Math.max(0,f.seasonalCap-f.earningsSeason);
  const earned=financialRound(Math.min(room,gross));
  f.earningsSeason=financialRound(f.earningsSeason+earned);
  f.latestDelta=delta;f.latestIncome=earned;f.lastDay=day;
  f.lastMatch={day,home,win,draw,goalsFor,goalsAgainst,fanDelta:delta,income:earned};
  // La cessione può far superare il budget iniziale o il guadagno stagionale massimo.
  s.budgets=s.budgets||{};
  s.budgets[clubId]=financialRound((s.budgets[clubId]||0)+earned);
  if(clubId===s.club)s.budget=financialRound((s.budget||0)+earned);
  return f.lastMatch;
}
function applyEconomyMatch(s,m,day){
  if(!m||!teamById(m.a)||!teamById(m.b))return;
  return {
    home:applyFanResult(s,m.a,true,m.ga,m.gb,day),
    away:applyFanResult(s,m.b,false,m.gb,m.ga,day)
  };
}
function applyEconomyRound(s,matches,day){
  ensureFinances(s);
  let mine=null;
  for(const m of matches||[]){
    const economics=applyEconomyMatch(s,m,day);
    if(m.a===s.club||m.b===s.club)mine=m.a===s.club?economics?.home:economics?.away;
  }
  return mine;
}

// La Gazzetta usa solo i cognomi, compresi gli articoli precedenti già archiviati.
function surnameForPress(name){
  const words=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(words.length<=1)return name||'';
  const raw=words.join(' ').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const known={
    'randall kolo muani':'Kolo Muani','andrea rizzo pinna':'Rizzo Pinna',
    'patrick cutrone':'Cutrone','charles de ketelaere':'De Ketelaere',
    'gianluca di marzio':'Di Marzio','federico di marco':'Di Marco',
    'giovanni di lorenzo':'Di Lorenzo','davide di lorenzo':'Di Lorenzo'
  };
  if(known[raw])return known[raw];
  const pre=/^(de|del|della|delle|di|da|van|von|der|den|el|al|la|le|dos|das)$/i;
  let start=words.length-1;
  while(start>0&&pre.test(words[start-1])&&words.length-start<3)start--;
  return words.slice(start).join(' ');
}
const gazViewWithFullNames=gazView;
gazView=function(){
  let html=gazViewWithFullNames(),r=st?.results?.[selectedReport]||st?.results?.[0];
  if(!r?.match)return html;
  const names=new Set();
  for(const player of Object.values(r.match.playerNames||{}))if(player?.name?.includes(' '))names.add(player.name);
  for(const e of r.match.events||[])for(const k of ['name','out','into'])if(typeof e[k]==='string'&&e[k].includes(' '))names.add(e[k]);
  for(const name of [...names].sort((a,b)=>b.length-a.length)){
    const full=ESC(name),short=ESC(surnameForPress(name));
    const quote=full.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    // Boundary by literal HTML content, not word boundary (apostrophes/accents can be present).
    html=html.replace(new RegExp(quote,'gi'),match=>match===match.toUpperCase()?short.toUpperCase():short);
  }
  return html;
};

window.goalSaveTask=function(evt){evt.preventDefault();const fd=new FormData(evt.target),oldid=String(fd.get('id')||''),a=loadGoals();let t=oldid?gt(oldid):null;
 let title=String(fd.get('title')||'').trim(),frontId=String(fd.get('frontId')||'');if(!title||!gf(frontId))return alert('Titolo e fronte obbligatori.');
 if(!t){t={id:guid(),createdAt:new Date().toISOString(),status:'todo',rewardKey:'',rewardQty:0,rewardAuto:false};a.tasks.push(t)}
 let d=String(fd.get('dueDate')||''),time=String(fd.get('dueTime')||''),rep=String(fd.get('repeat')||'none');
 let progress=Math.max(0,Number(fd.get('actualValue'))||0),target=Math.max(1,Number(fd.get('targetValue'))||3);
 let type=String(fd.get('type')||'simple'),components=String(fd.get('componentText')||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 let wd={};for(let k=0;k<=6;k++){const v=String(fd.get('weekdayTime'+k)||'');if(/^\d\d:\d\d$/.test(v))wd[k]=v}
 Object.assign(t,{title,frontId,notes:String(fd.get('notes')||''),type,due:d+(d&&time?'T'+time:''),defaultTime:time,deadlineDate:String(fd.get('deadlineDate')||''),durationMinutes:GCLAMP(Number(fd.get('durationMinutes'))||30,5,1440),repeat:rep,weekdays:fd.getAll('weekday').map(Number),weekdayTimes:wd,scheduleStart:rep!=='none'?(d||t.scheduleStart||TODAY()):'',endDate:String(fd.get('endDate')||''),skipDates:String(fd.get('skipDates')||'').split(',').map(s=>s.trim()).filter(Boolean),noCarry:fd.has('noCarry'),components,componentText:components.join('\n'),targetValue:target,actualValue:progress,dependsOn:String(fd.get('dependsOn')||''),calendarColorId:String(fd.get('calendarColorId')||''),rewardAuto:false});
 if(type==='progressive'||type==='frequency'){t.progressFraction=GCLAMP(progress/target,0,1);t.status=t.progressFraction===1?'done':t.progressFraction>0?'partial':'todo'}
 else if(type==='mixed'){t.checks=Array.isArray(t.checks)?t.checks:[];t.progressFraction=components.length?GCLAMP(t.checks.length/components.length,0,1):0;if(t.progressFraction<1&&t.status==='done')t.status='partial'}
 if(rep!=='none'&&!t.repeatGroup)t.repeatGroup=t.id;
 saveGoals();goalCloseModal();render();
};

window.goalMergeFromCity=function(){const src=sourceCity();if(!isArchive(src))return alert('Non trovo la REGINA città. Usa la stessa origine GitHub Pages o importa un backup JSON di REGINA in Impostazioni.');
 const dst=loadGoals(),frontIDs=new Set(dst.fronts.map(x=>x.id)),taskIDs=new Set(dst.tasks.map(x=>x.id));let nf=0,nt=0;
 for(const f of src.fronts)if(!frontIDs.has(f.id)){dst.fronts.push(structuredClone(f));frontIDs.add(f.id);nf++}
 for(const t of src.tasks)if(!taskIDs.has(t.id)){dst.tasks.push(structuredClone(t));taskIDs.add(t.id);nt++}
 saveGoals();render();alert(`Importazione terminata: ${nf} fronti e ${nt} tappe nuove. Le modifiche effettuate nella versione calcio sono rimaste inalterate. La città non è stata toccata.`)

// Unknown quote => separate team-strength fallback; never label fallback as market-value derived.
function technicalFromTransfermarktQuote(euros){
 const value=Number(euros);
 if(!Number.isFinite(value)||value<=0)return null;
 return +CLAMP(2.1+7.6*Math.log10(1+value/30000)/Math.log10(1+180000000/30000),0,10).toFixed(3);
}

function processEuroCompetition(cup,day,metrics){

 }else if(cup.phase!=='DONE'){
  const leg=cup.phaseLeg,phase=cup.phase;
  for(const p of cup.pairs){const home=leg%2===0?p.b:p.a,away=leg%2===0?p.a:p.b;
   let r=cupMatch(cup,home,away,day,metrics);matches.push(r);
   if(r.match.a===p.a){p.ga+=r.match.ga;p.gb+=r.match.gb}else{p.gb+=r.match.ga;p.ga+=r.match.gb}

crest=function(teamId,small=false){
 const t=teamById(teamId)||{name:'?'};const url=BADGE_LINKS[teamId];const abbrev=t.name.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
 return `<span class="crest-box ${small?'sm':''}" data-crest="${ESC(teamId)}" title="${ESC(t.name)}" style="position:relative"><span class="crest-letter" style="position:absolute">${ESC(abbrev)}</span>${url?`<img src="${ESC(url)}" alt="Stemma ${ESC(t.name)}" loading="lazy" onerror="this.style.display='none'" style="position:relative;background:#e8f2fa;z-index:1">`:''}</span>`;
};

const VALIDATION_ID=id=>String(id??'').trim();
function flatPlayers(){return Object.values(st?.squad||{}).flat();}
function findPlayerRow(row){
 let id=VALIDATION_ID(row.stablePersonId||row.id||'');
 if(id){let matches=flatPlayers().filter(p=>String(p.stablePersonId||'')===id);if(matches.length===1)return matches[0];}
 let clubId=String(row.clubId||''),club=String(row.club||'').trim().toLocaleLowerCase('it');
 const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLocaleLowerCase('it');
 let names=flatPlayers().filter(p=>norm(p.name)===norm(row.name));
 if(clubId)names=names.filter(p=>p.id.startsWith(clubId+'-'));
 else if(club)names=names.filter(p=>{let found=teamById(p.id.split('-').slice(0,2).join('-'))||teamById(p.id.split('-')[0]);return norm(found?.name)===norm(club)});
 return names.length===1?names[0]:null;
}
window.importTransfermarktCSV=async function(e){
 let f=e.target.files?.[0];if(!f||!st)return;
 try{
  const text=await f.text(),lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);
  if(lines.length<2)throw Error('CSV vuoto');
  let separator=lines[0].includes(';')?';':',';
  function csvLine(line){const parts=[];let cur='',quote=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote;}else if(c===separator&&!quote){parts.push(cur);cur=''}else cur+=c}parts.push(cur);return parts;}
  let head=csvLine(lines[0]).map(s=>s.trim());
  let ok=0,miss=[],amb=0;
  for(let k=1;k<lines.length;k++){

  try{let req=await fetch(url,{mode:'cors',cache:'force-cache'});
   if(req.ok && (req.headers.get('content-type')||'').match(/image|svg|xml/i)){
     await cache.put(url,req.clone());response=req;
   }
  }catch(e){}
 }
 if(response){const blob=await response.blob();if(blob.size>0 && blob.size<3_000_000){
  if(localBadgeURLs[id])URL.revokeObjectURL(localBadgeURLs[id]);
  localBadgeURLs[id]=URL.createObjectURL(blob);return true;
 }}
 return false;
}

(function(){

function loadIdentity(){return new Promise((resolve,reject)=>{if(window.google?.accounts?.oauth2)return resolve();const src='https://accounts.google.com/gsi/client';let sc=document.querySelector(`script[src="${src}"]`);if(!sc){sc=document.createElement('script');sc.src=src;sc.async=true;document.head.appendChild(sc)}sc.addEventListener('load',()=>resolve(),{once:true});sc.addEventListener('error',()=>reject(Error('Caricamento Google Identity Services non riuscito.')),{once:true})})}
window.reginaGoogleConnect=async function(){
 if(location.protocol!=='https:')return alert('Apri calcio.html su GitHub Pages con HTTPS, non come file locale.');
 const config=gcfg();if(!config.clientId)return alert('Inserisci e salva prima un ID client OAuth Google valido.');
 try{catMessage('Apertura autenticazione Google…');await loadIdentity();
  let client=google.accounts.oauth2.initTokenClient({client_id:config.clientId,scope:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.calendarlist.readonly',callback:async response=>{
   if(response.error){catMessage('Accesso negato: '+response.error);return}
   googleToken=response.access_token;googleExpiry=Date.now()+Math.max(10,response.expires_in-30)*1000;
   catMessage('Connesso. Recupero calendari…');await reginaGoogleList();
  }});client.requestAccessToken({prompt:'consent'});
 }catch(e){catMessage('Connessione non riuscita: '+e.message)}
}
function tokenReady(){if(!googleToken||googleExpiry<Date.now())throw Error('Accesso scaduto. Premi «Collega Google» per ri-autorizzare.');return googleToken}
async function googleAPI(path,method='GET',body=null){
 const token=tokenReady();const r=await fetch('https://www.googleapis.com/calendar/v3/'+path,{method,headers:{Authorization:'Bearer '+token, ...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
 if(!r.ok){let detail='';try{let json=await r.json();detail=json.error?.message||''}catch(e){}throw Error('Google Calendar '+r.status+' '+detail)}

 try{const res=await googleAPI('users/me/calendarList?maxResults=200');availableCalendars=(res.items||[]).filter(c=>c.accessRole==='owner'||c.accessRole==='writer');

window.reginaCalendarTasks=()=>currentGoals();
function datePlusMinutes(dt,n){let date=new Date(dt);date.setMinutes(date.getMinutes()+n);const p=x=>String(x).padStart(2,'0');return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}:00`}
function recurrenceRule(t){const week=['SU','MO','TU','WE','TH','FR','SA'];let r=t.repeat==='daily'?'FREQ=DAILY':t.repeat==='weekdays'?'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR':t.repeat==='custom'?'FREQ=WEEKLY;BYDAY='+(t.weekdays||[]).map(x=>week[x]).filter(Boolean).join(','):t.repeat==='weekly'?'FREQ=WEEKLY':t.repeat==='biweekly'?'FREQ=WEEKLY;INTERVAL=2':t.repeat==='monthly'?'FREQ=MONTHLY':'';if(r&&t.endDate)r+=';UNTIL='+t.endDate.replaceAll('-','')+'T235959Z';return r?['RRULE:'+r]:undefined}
function asEvent(t){const d=t.due.slice(0,10),time=(t.due.match(/T(\d\d):(\d\d)/)||[]);let start,end;
 if(time.length){const dt=d+'T'+time[1]+':'+time[2]+':00';start={dateTime:dt,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Rome'};end={dateTime:datePlusMinutes(dt,Number(t.durationMinutes)||30),timeZone:start.timeZone}}
 else{let day=new Date(d+'T12:00:00');day.setDate(day.getDate()+1);let p=x=>String(x).padStart(2,'0');end={date:`${day.getFullYear()}-${p(day.getMonth()+1)}-${p(day.getDate())}`};start={date:d}}
 let r={summary:t.title,description:(t.notes||'')+'\n\nSincronizzato da REGINA CALCIO (attività privata).',start,end,extendedProperties:{private:{reginaCalcioTaskId:t.id}}};
 const rule=recurrenceRule(t);if(rule)r.recurrence=rule;
 if(/^([1-9]|10|11)$/.test(String(t.calendarColorId||'')))r.colorId=String(t.calendarColorId);

}
window.reginaGooglePush=async function(){
 if(busyGoogle)return;let tasks=currentGoals(),config=gcfg(),ids=encodeURIComponent(config.calendarId||'primary');

 if(!confirm(`Inviare/aggiornare ${tasks.length} tappe incomplete su Google Calendar? Gli eventi creati da REGINA sono associati a un ID univoco, per evitare duplicati nei sincronismi successivi. Le altre voci del calendario NON verranno modificate.`))return;
 busyGoogle=true;let ok=0,fail=[];
 try{tokenReady();for(let t of tasks){try{let id=config.map?.[t.id],payload=asEvent(t),verb=id?'PUT':'POST';
  let path=`calendars/${ids}/events`+(id?'/'+encodeURIComponent(id):'');
  let result=await googleAPI(path,verb,payload);config.map[t.id]=result.id||id;ok++;
 }catch(e){fail.push(t.title+': '+e.message)}if(ok%10===0)catMessage('Sincronizzate '+ok+'/'+tasks.length+' tappe.')}
  persist();catMessage(`Completato: ${ok}/${tasks.length}. Problemi: ${fail.length}.`);if(fail.length)alert('Alcuni eventi non sono stati sincronizzati:\n'+fail.slice(0,12).join('\n'));

 let ok=0,err=[];

  try{let e=await googleAPI(`calendars/${cal}/events/${encodeURIComponent(eventId)}`);if(e.status==='cancelled')continue;
   const d=e.start?.dateTime||e.start?.date;if(!d)continue;
   t.title=String(e.summary||t.title);t.due=e.start?.dateTime?d.slice(0,16):d.slice(0,10);ok++;
  }catch(e){err.push(t.title+': '+e.message)}
 }
  if(ok){window.goalSaveImportedArchive(archive);render()};catMessage(`${ok} tappe aggiornate da Google. Problemi: ${err.length}.`);

// REGINA CALCIO 0.6.3 — Titoli SENZA articoli, cronaca CON articoli.
// Esempi: «EMPOLI, CHE BATOSTA!», «ROMA, TRIONFO!».
// La rielaborazione dei vecchi titoli avviene solo al momento della visualizzazione.
function pressHeadlineWithoutArticles(input){
 let title=String(input||'');
 const clubs=[...new Set((typeof ALLCLUBS!=='undefined'?ALLCLUBS.map(c=>c.name):[])
   .concat(['Delfino Pescara 1936','Delfino Pescara','Virtus Lanciano','Vibonese']))]
   .sort((a,b)=>b.length-a.length);
 const escapeRegex=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const boundary='(?=$|[^\\p{L}\\p{N}])';
 for(const club of clubs){
   const n=escapeRegex(club);
   // Evitiamo titoli goffi come «DISASTRO DELL'EMPOLI».
   const dramatic=new RegExp('(^|\\s+)(DISASTRO|TRIONFO)\\s+(?:(?:del|dello|della|dei|degli|delle)\\s+|dell[\\u0027\\u2019])('+n+')'+boundary,'giu');
   title=title.replace(dramatic,(all,lead,word,name)=>lead+name.toLocaleUpperCase('it-IT')+', '+word.toLocaleUpperCase('it-IT'));
   const article=new RegExp('(^|[\\s:;,.!?()])(?:(?:il|lo|la|i|gli|le|del|dello|della|dei|degli|delle|al|allo|alla|ai|agli|alle|dal|dallo|dalla|dai|dagli|dalle|nel|nello|nella|nei|negli|nelle|sul|sullo|sulla|sui|sugli|sulle)\\s+|(?:l|dell|all|dall|nell|sull)[\\u0027\\u2019])('+n+')'+boundary,'giu');
   title=title.replace(article,(all,lead,name)=>lead+name);
 }
 return title;
}
const articleBeforeNoHeadlines=article;
article=function(...args){
 const report=articleBeforeNoHeadlines(...args);
 if(report&&typeof report.title==='string')report.title=pressHeadlineWithoutArticles(report.title);
 return report;
};

 return template.innerHTML;
};
